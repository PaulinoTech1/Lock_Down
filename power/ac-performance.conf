# power/ac-performance.conf - PowerDevil profile: AC performance.
#
# Consumed by: KDE PowerDevil (the single power-policy owner; see docs/KDE.md).
# Scope: applies ONLY when the AC adapter is connected AND the user has
# explicitly selected this profile. Never the automatic default.
# The existing 75/80% charge thresholds are RESPECTED and never changed.
#
# What each setting changes:
#
# EPP (Energy Performance Preference):
#   epp=performance (0): the CPU prefers the highest clocks the thermal
#   and power limits allow. Effect: shortest compile/test times, highest
#   sustained throughput the 15 W chassis can deliver. Cost: maximum heat
#   and fan noise; on battery this profile must never engage (it would
#   drain the pack fast and heat-soak the chassis for no benefit).
#
# Platform profile:
#   platform_profile=performance: firmware raises power limits toward the
#   chassis maximum. Effect: longer turbo residency. Cost: fan noise;
#   sustained all-core loads will still thermally throttle because the
#   chassis, not the setting, is the limit. This profile buys burst
#   performance, not sustained miracles.
#
# Screen / idle behavior:
#   dim on idle retained (panel power is panel power, even on AC); suspend
#   on idle uses the longest delay. The machine is on AC, but an unattended
#   unlocked session is still a physical-access risk, so idle suspend
#   stays enabled.
#
# Disk / device autosuspend:
#   USB autosuspend enabled except the Wi-Fi adapter (0e8d:7961). Even on
#   AC, autosuspending the only network path causes dropouts; the
#   denylist is unconditional across all profiles. NVMe APST untouched.
#
# What this profile does NOT do:
#   - Does not change charge thresholds (75/80% stay).
#   - Does not override thermal protections; the firmware still throttles
#     at its limits.
#   - Not a security control; a throughput policy for plugged-in work.

[powerdevil-ac-performance]
epp=performance
platform_profile=performance
dim_on_idle=true
suspend_on_idle=true
suspend_idle_delay_minutes=60
usb_autosuspend=true
usb_autosuspend_denylist=0e8d:7961
