# power/balanced.conf - PowerDevil profile: balanced (AC or battery default).
#
# Consumed by: KDE PowerDevil (the single power-policy owner; see docs/KDE.md).
# Scope: the default profile; used on AC unless ac-performance is selected,
# and as the fallback when the power source is ambiguous.
# The existing 75/80% charge thresholds are RESPECTED and never changed.
#
# What each setting changes:
#
# EPP (Energy Performance Preference):
#   epp=balance_performance (128): the CPU ramps clocks promptly under
#   load but still idles deeply. Effect: interactive work feels instant;
#   idle power stays near the battery profile's. Cost: slightly higher
#   average power than the battery profile under sustained load; on AC
#   that cost is irrelevant, on battery it is the price of responsiveness.
#
# Platform profile:
#   platform_profile=balanced: firmware default fan/power behavior.
#   Effect: no artificial power cap beyond the chassis thermal design.
#   Cost: fans may spin under sustained load; expected on this chassis.
#
# Screen / idle behavior:
#   dim on idle; suspend to s2idle after a longer delay than the battery
#   profile. See docs/SUSPEND.md for why s2idle is the only suspend mode.
#
# Disk / device autosuspend:
#   USB autosuspend enabled except the Wi-Fi adapter (0e8d:7961), same as
#   the battery profile. NVMe APST untouched (see docs/NVME_POWER.md).
#
# What this profile does NOT do:
#   - Does not change charge thresholds (75/80% stay).
#   - Does not disable any device.
#   - Not a security control; a usability default.

[powerdevil-balanced]
epp=balance_performance
platform_profile=balanced
dim_on_idle=true
suspend_on_idle=true
suspend_idle_delay_minutes=30
usb_autosuspend=true
usb_autosuspend_denylist=0e8d:7961
