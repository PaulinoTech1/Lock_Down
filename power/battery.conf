# power/battery.conf - PowerDevil profile: on battery.
#
# Consumed by: KDE PowerDevil (the single power-policy owner; see docs/KDE.md).
# Scope: applies when the AC adapter is NOT connected.
# The existing 75/80% charge thresholds are RESPECTED and never changed by
# any profile in this directory. Threshold control lives in sysfs /
# thinkpad_acpi, outside PowerDevil's reach.
#
# What each setting changes:
#
# EPP (Energy Performance Preference), scale 0 (performance) to 255 (power):
#   epp=power (255 on the intel_pstate passive/active scale): the CPU
#   prefers the lowest power state that still meets demand. Effect: lower
#   clocks under light load, deeper idle states, measurably longer battery
#   life. Cost: bursty interactive latency rises slightly; heavy compiles
#   take longer on battery. That is the intended tradeoff.
#
# Platform profile (thinkpad_acpi / ACPI platform profile):
#   platform_profile=low-power: firmware-level hint that the platform
#   should prefer quiet/cool operation (fan curves, power limits).
#   Effect: lower sustained power limits, less fan noise. Cost: sustained
#   all-core workloads throttle sooner; on a 15 W chassis this is usually
#   the thermal limit anyway.
#
# Screen / idle behavior:
#   dim on idle, then suspend to s2idle (the firmware's only suspend mode;
#   see docs/SUSPEND.md). Idle-dim saves panel power, the largest single
#   battery draw on this machine after the SoC.
#
# Disk / device autosuspend:
#   USB autosuspend enabled for all devices EXCEPT the external Wi-Fi
#   adapter (0e8d:7961), which must never autosuspend: it is the only
#   network path, and autosuspend on it causes dropouts and failed
#   resumes (see docs/SUSPEND.md test matrix).
#   NVMe APST stays enabled (see docs/NVME_POWER.md); this profile does
#   not touch it.
#
# What this profile does NOT do:
#   - Does not change charge thresholds (75/80% stay).
#   - Does not disable radios (Wi-Fi stays up; the machine is useless
#     without it).
#   - Does not claim to be a security control; it is a battery-life policy.

[powerdevil-battery]
epp=power
platform_profile=low-power
dim_on_idle=true
suspend_on_idle=true
suspend_idle_delay_minutes=15
usb_autosuspend=true
usb_autosuspend_denylist=0e8d:7961
