name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing shell and signing tool dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck sbsigntool binutils gnupg openssl make nftables iproute2 iputils-ping
      - name: Shell syntax and shellcheck (including skill scripts)
        run: |
          find scripts tests lock-down-kernel/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find scripts tests lock-down-kernel/scripts -name '*.sh' -print0 | xargs -0 shellcheck -S error
      - name: Current candidate static policy
        run: bash scripts/check-current-candidate.sh
      - name: Audit11 Python syntax and offline evidence fixtures
        run: |
          python3 -B -m py_compile scripts/analyze-kconfig-delta.py scripts/collect-validation-evidence.py
          python3 -B tests/test-kconfig-analysis.py
          python3 -B tests/test-validation-collector.py
      - name: Two-domain repository security fixtures
        run: |
          python3 -B tests/test-control-domain-isolation.py
          python3 -B tests/test-work-domain-profile.py
          python3 -B tests/test-profile-status.py
          python3 -B scripts/validate-work-domain.py vm-profiles/work-domain/domain.xml
      - name: Disposable two-domain nftables packet fixture
        run: sudo env LOCKDOWN_DISPOSABLE_CI=1 CI=true bash tests/test-two-domain-nft-netns.sh
      - name: Bounded safety checks (matches redacted)
        run: bash scripts/check-static-safety.sh .
      - name: Behavioral fixtures and disposable cryptographic integration
        env:
          REQUIRE_CRYPTO: '1'
        run: bash tests/run-tooling-tests.sh
      - name: Existing userspace file checks
        run: |
          bash tests/test-sysctl-values.sh sysctl/99-workstation-hardening.conf
          bash tests/test-nft-syntax.sh
      - name: Markdown relative links
        run: bash scripts/check-doc-links.sh
      - name: Scope
        run: echo 'Static and disposable fixtures only. No kernel build, installation, boot, suspend or hardware validation.'
