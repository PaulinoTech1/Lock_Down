# USBGuard baseline rules for the hardened workstation.
#
# Purpose: authorize only known devices; everything else is rejected.
# Read docs/USB_SECURITY.md before editing. Fill every <PLACEHOLDER> at
# deployment time from 'usbguard list-devices' output.
#
# HARD CONSTRAINT: the MediaTek MT7921U (0e8d:7961, bus 4 port 1) is the
# only network path. Its allow rule comes BEFORE the default reject. A
# default-deny without this proven whitelist kills networking at boot.
#
# HONEST LIMITATION: VID:PID is spoofable. The via-port qualifier raises
# the bar to physical port access but is not cryptographic identity.
# Tighten with 'serial "..."' once the real serial is read from the device.

# --- USB controller and root hubs: must come first or nothing enumerates.
# Generate exact lines with: usbguard generate-policy
# Example shape (fill from the machine):
# allow id 1d6b:0003 serial "0000:00:14.0" name "xHCI Host Controller" \
#     via-port "usb1" with-interface 09:00:00
<PLACEHOLDER: controller and root-hub allow rules from usbguard generate-policy>

# --- MT7921U Wi-Fi: the only network path. VID:PID + port path.
# Bus 4 port 1 on the PCH xHCI controller. Do NOT move this rule below
# the default reject. To tighten: append serial "<ACTUAL_SERIAL>" after
# reading it from 'usbguard list-devices -t' while the adapter is attached.
allow id 0e8d:7961 name "Wireless_Device" via-port "4-1" with-interface { e0:01:01, e0:01:03 }

# --- YubiKey: allow by VID:PID, tighten with serial at deployment.
# Yubico VID is 1050; the PID varies by model and firmware mode.
# Fill in from 'usbguard list-devices': replace <PID> and <SERIAL>.
# allow id 1050:<PID> serial "<SERIAL>" name "Yubico" via-port "<PORT>" with-interface { 03:00:00, 03:01:01, 03:01:02 }

# --- Default: reject everything else, with a message so the user gets
#      feedback instead of a silent hang. Keep this LAST.
reject with-message "Device blocked by USBGuard policy"
