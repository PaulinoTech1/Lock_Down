# dracut drop-in for the exact audit9 release only; prior kernels are unchanged.
# Built-in drivers need explicit early firmware in this monolithic profile.
if [[ ${kernel:-} == 6.18.53-lockdown-t14g3-audit9 ]]; then
    install_items+=" /lib/firmware/i915/adlp_dmc.bin.zst "
    install_items+=" /lib/firmware/i915/adlp_guc_70.bin.zst "
    install_items+=" /lib/firmware/i915/tgl_huc.bin.zst "
    install_items+=" /lib/firmware/mediatek/WIFI_RAM_CODE_MT7961_1.bin.zst "
    install_items+=" /lib/firmware/mediatek/WIFI_MT7961_patch_mcu_1_2_hdr.bin.zst "
    install_items+=" /lib/firmware/intel/sof/sof-adl.ri "
    install_items+=" /lib/firmware/intel/sof-tplg/sof-hda-generic.tplg "
    install_items+=" /lib/firmware/intel/sof-tplg/sof-hda-generic-2ch.tplg "
    install_items+=" /lib/firmware/intel/sof-tplg/sof-hda-generic-4ch.tplg "
    # cfg80211 requests both before /init; retain signed-regdb enforcement.
    install_items+=" /lib/firmware/regulatory.db "
    install_items+=" /lib/firmware/regulatory.db.p7s "
fi
