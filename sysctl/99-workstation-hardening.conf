# 99-workstation-hardening.conf - sysctl hardening for the T14 Gen 3 workstation.
#
# Every entry carries a comment: purpose, cost/tradeoff, limitation.
# Apply with: sysctl --system (reads /etc/sysctl.d/ in lexical order).
# Verify with: sysctl -a | grep -E '<key>' or the tests/test-sysctl-values.sh check.
#
# Scope: Ubuntu LTS host, KDE Plasma Wayland, KVM/libvirt in use.
# Nothing here disables user namespaces globally or removes eBPF; both are
# restricted by privilege instead (see notes below).

# --- eBPF ---
# Purpose: unprivileged users cannot load eBPF programs. Unprivileged eBPF
# has been a repeated source of kernel privilege-escalation bugs, and this
# workstation has no legitimate unprivileged-eBPF use case.
# Cost: tools that need unprivileged BPF (some container runtimes without
# privileges, bcc user tools run as non-root) will fail. Run diagnostics as
# root instead.
# Why eBPF is not removed: the eBPF core stays because privileged eBPF is a
# legitimate diagnostic tool (perf, tracing, seccomp filters all build on
# it). Removing the subsystem would break tooling; restricting the loader
# to privileged users keeps the capability while closing the unprivileged
# attack surface.
kernel.unprivileged_bpf_disabled=1

# --- perf ---
# Purpose: perf_event_paranoid=2 blocks unprivileged perf (which can sample
# kernel addresses and, historically, leak across boundaries) while still
# allowing per-process profiling of the user's own processes.
# Cost: system-wide profiling requires root. Value 3 would block even
# per-process unprivileged profiling; 2 is the balanced choice here.
# Limitation: not a side-channel fix; perf is one measurement path among many.
kernel.perf_event_paranoid=2

# --- kernel pointer exposure ---
# Purpose: kptr_restrict=2 hides kernel pointer values from unprivileged
# users in /proc and dmesg-style outputs, raising the bar for exploits that
# need kernel address layout.
# Cost: debugging kernel issues as non-root gets harder; root still sees
# the pointers.
# Limitation: does not stop KASLR bypass via other info leaks; defense in depth only.
kernel.kptr_restrict=2

# --- dmesg ---
# Purpose: dmesg_restrict=1 limits kernel log access to privileged users.
# dmesg routinely leaks hardware addresses, driver internals, and boot-time
# layout useful to local exploit development.
# Cost: scripts that parse dmesg as non-root (including this repo's
# check-iommu.sh dmesg section) degrade gracefully instead; run them with
# sudo for full output.
kernel.dmesg_restrict=1

# --- ptrace ---
# Purpose: yama.ptrace_scope=1 restricts ptrace to parent/ancestor
# processes (classic Unix behavior) instead of any same-uid process.
# Blocks a compromised process from attaching to unrelated user processes
# (e.g., scraping a password manager or browser).
# Cost: debuggers and some crash-reporters need adjustment (run under the
# target's parent or with CAP_SYS_PTRACE).
# Limitation: a compromised parent can still ptrace its children; this
# narrows, not closes, the debugger-shaped hole.
kernel.yama.ptrace_scope=1

# --- core dumps ---
# Purpose: core_pattern pipes crashes to apport/systemd-coredump instead of
# writing world-readable core files into the crashing process's cwd.
# A core dump of a privileged or secret-handling process can contain keys
# and tokens; the pipe handler applies access control and size limits.
# Cost: debugging a crash requires pulling the dump from the handler
# (coredumpctl) rather than finding core in cwd.
# Note: this entry documents the handling; the actual pattern value is set
# by the apport/systemd-coredump package. Do not set a bare "core" pattern.
# kernel.core_pattern is intentionally not assigned a raw value here.
# Limitation: crash handlers themselves must be kept patched; they parse
# untrusted crashing-process state.

# --- ASLR ---
# Purpose: vm.mmap_rnd_bits=32 maximizes the entropy of mmap base
# randomization on x86_64, making brute-force ASLR bypass harder.
# Cost: none measurable. Some very old binaries with hardcoded address
# assumptions could break; none are expected on this Ubuntu install.
# Limitation: ASLR is probabilistic defense; an info leak still defeats it.
vm.mmap_rnd_bits=32
# vm.mmap_min_addr is left to the distro default (65536). Raising it
# further breaks Wine and some legacy userspace; the default already
# blocks the NULL-page class.

# --- IPv4 hardening ---
# Purpose: rp_filter=1 (strict reverse-path validation) drops packets
# arriving on an interface the reply would not leave by, defeating basic
# source-spoofing.
# Cost: breaks asymmetric routing setups; this laptop has one network path
# (USB Wi-Fi), so asymmetric routing does not apply.
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
# Purpose: ignore ICMP redirects. A malicious redirect can steer traffic
# through an attacker on a shared segment.
# Cost: none on a single-homed laptop; legitimate redirect use is a
# router-to-router optimization this host never needs.
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
# Purpose: do not send ICMP redirects ourselves (we are not a router).
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
# Purpose: ignore source-routed packets (loose and strict). Source routing
# lets the sender dictate the path, bypassing topology assumptions.
# Cost: none; source routing is obsolete on the public internet.
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
# Purpose: log martian packets (spoofed/impossible source addresses) so
# spoof attempts are visible in the kernel log.
# Cost: log volume under active spoofing; acceptable on a workstation.
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1

# --- IPv6 hardening (same reasoning as IPv4) ---
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0

# --- TCP hardening ---
# Purpose: tcp_syncookies=1 keeps SYN-flood resilience available without
# the downsides of always-on cookies (enabled on demand under backlog
# pressure).
# Cost: none in normal operation.
net.ipv4.tcp_syncookies=1
# Purpose: disable TCP timestamps. Timestamps leak host uptime and enable
# idle-scan style fingerprinting; the performance benefit (better RTTM) is
# negligible on a workstation link.
# Cost: slightly less accurate RTT estimation on lossy paths; unnoticeable
# in practice.
net.ipv4.tcp_timestamps=0
# Purpose: tcp_rfc1337=1 protects against TIME-WAIT assassination (a blind
# RST tearing down a connection the attacker cannot see).
# Cost: none.
net.ipv4.tcp_rfc1337=1

# --- filesystem link protections ---
# Purpose: fs.protected_symlinks=1: only the symlink owner (or the
# directory owner) may follow a symlink in a world-writable sticky
# directory (/tmp). Blocks classic /tmp symlink attacks where an attacker
# pre-plants a symlink to trick a privileged writer.
# Cost: none for well-behaved software.
fs.protected_symlinks=1
# Purpose: fs.protected_hardlinks=1: hardlinks may only be created to files
# the linker could already read/write. Blocks an attacker hardlinking to a
# root-owned file they cannot read and then waiting for it to be replaced.
# Cost: none for well-behaved software.
fs.protected_hardlinks=1
# Purpose: fs.protected_fifos=2 and fs.protected_regular=2: block opening
# FIFOs and regular files in world-writable sticky dirs unless the opener
# owns them (mode 2 = also require ownership match for the directory
# owner case). Same /tmp attack class as symlinks.
# Cost: none for well-behaved software.
fs.protected_fifos=2
fs.protected_regular=2
# Purpose: fs.suid_dumpable=0: a setuid process that crashes does not dump
# core readable by the invoking user (the dump could contain privileged
# memory contents). Pairs with the core_pattern handling note above.
# Cost: harder to debug crashing setuid binaries; none exist that the user
# needs to debug.
fs.suid_dumpable=0

# --- user namespaces ---
# NOTE: kernel.unprivileged_userns_clone is intentionally NOT set here.
# Do NOT disable user namespaces globally. Sandboxing on this workstation
# depends on them: Chromium/Electron renderers, Flatpak, systemd portable
# services, and several container-adjacent tools all require unprivileged
# user namespaces to function. Disabling them globally trades a large,
# daily usability loss for a control that is better applied narrowly.
# Preferred approach: keep userns available and restrict by policy where
# the kernel supports it (AppArmor userns mediation on Ubuntu kernels:
# an AppArmor profile can deny `capability` use inside userns or confine
# which profiles may create them). Restrict the risky consumers, not the
# primitive.
# Limitation: userns remains a historically bug-prone area; the mitigation
# is patching promptly and confining consumers, not pretending the feature
# is off.
# kernel.unprivileged_userns_clone is left at the distro default.
